# Tests — every PR and every push to main.
#
# npm-publish.yml's check job already typechecks, lints, builds and packs; it
# does not run a single test. This runs them: the unit suite on the two Node
# versions a user is likely to have, then the end-to-end scripts that drive
# the real CLI, bridge, speech-to-text path and MCP transport
# (scripts/live-pipe-test.mjs) and the real PWA in headless Chromium
# (scripts/live-pwa-stream-test.mjs).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + end-to-end (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      # --legacy-peer-deps: same reason as npm-publish.yml (@openng/optimus-ui's
      # peer on @angular/cdk ^21).
      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # squeakr run / pipe / logs against a stand-in Whisper server and the
      # stub agent: segmentation, delivery, replies, transcripts, session logs
      # and their compression across restarts.
      - name: End to end — audio pipe, transcripts, session logs
        run: node scripts/live-pipe-test.mjs

      # Engine reply → web client, timed per segment: the words must go out
      # before the agent is spawned or the turn queued.
      - name: End to end — transcript reaches the web client at once
        run: node scripts/live-transcript-latency-test.mjs

      # TTS forwarded as the voice produces it; STT uploaded while spoken.
      - name: End to end — speech audio moves in the chunks it is produced in
        run: node scripts/live-speech-chunking-test.mjs

      # Telegram, Slack and WhatsApp against stand-ins of their APIs (docs/44).
      - name: End to end — channels
        run: node scripts/live-channels-test.mjs

      # Agent audio streams over the real MCP transport to a stand-in phone:
      # decoding, ordering, ownership, bulk close, logs (docs/47).
      - name: End to end — agent audio streams
        run: node scripts/live-agent-audio-test.mjs

      # Uploads, transcripts, view_media, and media reaching the stub agent as
      # a turn, inline in next_voice_turn, and attached mid-work (docs/46).
      - name: End to end — media pipe
        run: node scripts/live-media-pipe-test.mjs

  pwa-stream:
    name: PWA direct stream (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps playwright@1.61.1
          npx playwright install --with-deps chromium

      # Switches Input mode through the Config screen, streams Chrome's fake
      # microphone, and checks the agent heard and answered.
      - name: PWA streams its mic to the agent
        run: node scripts/live-pwa-stream-test.mjs

      # The agent's own audio (docs/47) played by the page's Web Audio code:
      # queue vs async ordering against speak(), packets, stop, dry streams.
      - name: PWA plays agent audio streams
        run: node scripts/live-pwa-agent-audio-test.mjs
